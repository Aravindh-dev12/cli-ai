services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-local-admin-only}
      APP_USER: ${DB_USER:-clinevo}
      APP_USER_PASSWORD: ${DB_PASSWORD:-clinevo_dev_only}
    ports: ["1521:1521"]
    volumes: ["oracle-data:/opt/oracle/oradata"]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  clamav:
    image: clamav/clamav:stable
    volumes: ["clamav-db:/var/lib/clamav"]
    expose: ["3310"]
    restart: unless-stopped

  document-store-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data/originals /data/quarantine && chown -R 10001:10001 /data && chmod 0750 /data /data/originals /data/quarantine"]
    volumes: ["document-store:/data"]
    restart: "no"

  ai-service:
    build: ./ai-service
    environment:
      MAX_PDF_BYTES: ${MAX_ATTACHMENT_BYTES:-20971520}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      DECISION_BACKEND: ${DECISION_BACKEND:-laya}
      DECISION_FALLBACK: ${DECISION_FALLBACK:-true}
      LAYA_LOAD_MODE: ${LAYA_LOAD_MODE:-lazy}
      LAYA_MAX_LOADED: ${LAYA_MAX_LOADED:-1}
      LAYA_MODEL: ${LAYA_MODEL:-}
      JEV_API_URL: ${JEV_API_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-15}
      HF_HOME: /cache/huggingface
    volumes: ["laya-cache:/cache"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: ${DB_USER:-clinevo}
      DB_PASSWORD: ${DB_PASSWORD:-clinevo_dev_only}
      AI_SERVICE_URL: http://ai-service:8000
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-993}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-60}
      AUTH_MODE: ${AUTH_MODE:-demo}
      CLINEVO_API_KEY: ${CLINEVO_API_KEY:-}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-clinevo-inbox}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      OIDC_PRINCIPAL_CLAIM: ${OIDC_PRINCIPAL_CLAIM:-preferred_username}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-20971520}
      JOB_POLL_MS: ${JOB_POLL_MS:-1000}
      JOB_RECOVERY_MS: ${JOB_RECOVERY_MS:-30000}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_BATCH_SIZE: ${JOB_BATCH_SIZE:-4}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-5}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-300}
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_CONNECT_TIMEOUT_MS: ${CLAMAV_CONNECT_TIMEOUT_MS:-3000}
      CLAMAV_READ_TIMEOUT_MS: ${CLAMAV_READ_TIMEOUT_MS:-30000}
      CLAMAV_CHUNK_BYTES: ${CLAMAV_CHUNK_BYTES:-8192}
      DOCUMENT_STORAGE_MODE: ${DOCUMENT_STORAGE_MODE:-filesystem}
      DOCUMENT_STORAGE_ROOT: /var/lib/clinevo/documents
      DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS:-0}
      DOCUMENT_PURGE_POLL_MS: ${DOCUMENT_PURGE_POLL_MS:-3600000}
      DOCUMENT_PURGE_BATCH_SIZE: ${DOCUMENT_PURGE_BATCH_SIZE:-50}
    volumes: ["document-store:/var/lib/clinevo/documents"]
    depends_on:
      oracle: { condition: service_healthy }
      ai-service: { condition: service_healthy }
      clamav: { condition: service_started }
      document-store-init: { condition: service_completed_successfully }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports: ["4200:80"]

volumes:
  oracle-data:
  clamav-db:
  document-store:
  laya-cache:
