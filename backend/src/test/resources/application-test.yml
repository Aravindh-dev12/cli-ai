spring:
  datasource:
    url: jdbc:h2:mem:clinevo;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
clinevo:
  agent:
    enabled: false
  api-key: ""
  ai-service-url: http://localhost:65535
  job-poll-ms: 3600000
  job-recovery-ms: 3600000
  job-max-attempts: 3
  job-batch-size: 2
  job-retry-base-seconds: 1
  job-lease-seconds: 60
  mail:
    host: ""
logging:
  level:
    root: WARN
