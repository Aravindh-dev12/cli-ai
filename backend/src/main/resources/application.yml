server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USER:clinevo}
    password: ${DB_PASSWORD:clinevo_dev_only}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: clinevo-inbox-api
    synthetic-data-only: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-system}]"

clinevo:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  ai-connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
  ai-read-timeout-ms: ${AI_READ_TIMEOUT_MS:120000}
  mail-poll-seconds: ${MAIL_POLL_SECONDS:60}
  agent-poll-ms: ${AGENT_POLL_MS:2000}
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}
  api-key: ${CLINEVO_API_KEY:}
  max-attachment-bytes: ${MAX_ATTACHMENT_BYTES:20971520}
  job-poll-ms: ${JOB_POLL_MS:1000}
  job-recovery-ms: ${JOB_RECOVERY_MS:30000}
  job-max-attempts: ${JOB_MAX_ATTEMPTS:3}
  job-batch-size: ${JOB_BATCH_SIZE:4}
  job-retry-base-seconds: ${JOB_RETRY_BASE_SECONDS:5}
  job-lease-seconds: ${JOB_LEASE_SECONDS:300}
  auth:
    mode: ${AUTH_MODE:demo}
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      audience: ${OIDC_AUDIENCE:clinevo-inbox}
      roles-claim: ${OIDC_ROLES_CLAIM:roles}
      principal-claim: ${OIDC_PRINCIPAL_CLAIM:preferred_username}
  malware:
    enabled: ${MALWARE_SCAN_ENABLED:true}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    connect-timeout-ms: ${CLAMAV_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CLAMAV_READ_TIMEOUT_MS:30000}
    chunk-bytes: ${CLAMAV_CHUNK_BYTES:8192}
  document-storage:
    mode: ${DOCUMENT_STORAGE_MODE:database}
    root: ${DOCUMENT_STORAGE_ROOT:/var/lib/clinevo/documents}
    retention-days: ${DOCUMENT_RETENTION_DAYS:0}
    purge-poll-ms: ${DOCUMENT_PURGE_POLL_MS:3600000}
    purge-batch-size: ${DOCUMENT_PURGE_BATCH_SIZE:50}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:993}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    folder: ${MAIL_FOLDER:INBOX}
    ssl: ${MAIL_SSL:true}
