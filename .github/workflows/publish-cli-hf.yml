name: Publish CLI model to Hugging Face

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: Hugging Face model repository
        required: true
        default: Aravindhan11/cli-ai
      private:
        description: Publish as private
        required: false
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU model toolchain
        run: |
          python -m pip install --upgrade pip
          pip install 'torch==2.10.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy>=2,<3' 'pydantic==2.11.7' 'safetensors>=0.5,<1' 'huggingface_hub>=1.32,<2'
      - name: Build reproducible CLI checkpoint
        working-directory: ai-service
        run: python -m ml.train_owned --size 64 --epochs 1 --tasks route --output /tmp/cli.pt
      - name: Export Hugging Face package
        working-directory: ai-service
        run: python -m ml.export_cli --checkpoint /tmp/cli.pt --output /tmp/hf --repo-id ${{ inputs.model_repo }}
      - name: Upload packaged CLI model artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-hf-model-${{ github.run_number }}
          path: /tmp/hf
          if-no-files-found: error
      - name: Publish model when HF write token is available
        if: env.HF_TOKEN != ''
        working-directory: ai-service
        run: python -m ml.hf_upload --repo-id '${{ inputs.model_repo }}' --folder /tmp/hf $( [ '${{ inputs.private }}' = 'true' ] && echo '--private' )
      - name: Report Hugging Face publication state
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "Hugging Face publication requested: https://huggingface.co/${{ inputs.model_repo }}"
          else
            echo "HF_TOKEN not configured; packaged CLI model is available as the workflow artifact."
          fi
