name: CLI v2 live benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark_size:
        description: Number of synthetic records generated before subject-held-out testing
        required: false
        default: "64"

permissions:
  contents: read

jobs:
  live-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TYPESAFE_API_KEY: ${{ inputs.benchmark_size && secrets.TYPESAFE_API_KEY || secrets.TYPESAFE_API_KEY }}
      JEV_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      LAYA_LOAD_MODE: lazy
      BENCHMARK_SIZE: ${{ inputs.benchmark_size || '64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU decision stack
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.10.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=2,<3" "pydantic==2.11.7" "httpx>=0.28,<0.29" "laya>=0.3.3,<0.4.0"
      - name: Train reproducible CLI checkpoint
        working-directory: ai-service
        run: |
          python -m ml.train_owned --size 64 --epochs 2 --tasks route --seed 7 --output /tmp/cli-v2.pt
      - name: Run subject-held-out live comparison
        working-directory: ai-service
        run: |
          python -m ml.live_compare_v2 --checkpoint /tmp/cli-v2.pt --size "$BENCHMARK_SIZE" --seed 91023 --out /tmp/cli-laya-jev-v2.json
      - name: Upload v2 benchmark
        uses: actions/upload-artifact@v4
        with:
          name: cli-laya-jev-live-v2
          path: /tmp/cli-laya-jev-v2.json
